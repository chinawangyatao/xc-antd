name: Publish private npm package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: http://repo.zhihuiwenlvyun.com/repository/npm-hosted/
          always-auth: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Build docs
        run: bun run build:docs

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/xc-antd/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Inspect package contents
        working-directory: packages/xc-antd
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/xc-antd
        run: npm publish --registry http://repo.zhihuiwenlvyun.com/repository/npm-hosted/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
